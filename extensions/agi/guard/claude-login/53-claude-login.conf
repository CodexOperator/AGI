# drop-in for ONE post: install as /etc/systemd/system/agi-post@<post>.service.d/53-claude-login.conf (goal:g7.16.1.11.46.20 V2; owner GO "8. Go" 11-01, card-belam item (6)).
# The Claude login rides as a credential: root holds /etc/credstore/claude-login-<post> (0600 root, the post's ~/.claude/.credentials.json taken at the host act).
# It is a ONE-SHOT SEED, never a mount: a refresh rewrites the file in place and ROTATES the refresh token (measured 10-26), so the post's own copy is the live
# one after its first refresh and the credstore copy is spent. Seed ONLY when the post has no file; never overwrite (an overwrite would put back a dead token).
# Dead login recovery (by hand, never automatic): rm ~/.claude/.credentials.json as the post's uid, a fresh /login, re-take the credstore file, restart.
[Service]
LoadCredential=claude-login:/etc/credstore/claude-login-%i
ExecStartPre=sh -c 'f=/var/lib/agi/%i/.claude/.credentials.json;[ -e "$f" ]&&exit 0;mkdir -p /var/lib/agi/%i/.claude&&install -m 600 "$CREDENTIALS_DIRECTORY/claude-login" "$f"&&echo "[cred] %i: login seeded from the credential (one-shot)">&2'
