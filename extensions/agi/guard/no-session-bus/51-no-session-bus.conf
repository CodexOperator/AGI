# drop-in for agi-post@.service: install as /etc/systemd/system/agi-post@.service.d/51-no-session-bus.conf
# Claude Code's PR-status poll runs `gh auth token --hostname github.com`; a post uid has no gh login, so gh asks
# the keyring, and godbus autolaunches a session bus (dbus-launch -> dbus-daemon --session) that outlives the
# call: ~1 orphan bus per poll per post (541 / 1.27 GB found 10-09; 80 live 08:4xZ 10-10). With the address set to
# "disabled:" the keyring lookup fails fast, gh exits the same (rc 1), and no bus starts (measured 08:5xZ 10-10:
# plain +1 bus per call, disabled +0). agi-dbus-reap stays as the backstop.
[Service]
Environment=DBUS_SESSION_BUS_ADDRESS=disabled:
